#cloud-config
# JLS persistent Ubuntu developer VM bootstrap for Proxmox.
# Attach this as *vendor-data* so Proxmox can continue generating user-data
# containing ciuser, SSH keys, hostname, and network settings.

timezone: America/New_York
locale: en_US.UTF-8
package_update: true
package_upgrade: true
ssh_pwauth: false

packages:
  - acl
  - bash-completion
  - btop
  - build-essential
  - ca-certificates
  - curl
  - dbus-user-session
  - direnv
  - dnsutils
  - eza
  - eza-bash-completion
  - fd-find
  - file
  - fzf
  - gh
  - git
  - gnupg
  - htop
  - httpie
  - jq
  - less
  - libffi-dev
  - libssl-dev
  - lsof
  - make
  - ncdu
  - net-tools
  - openssh-client
  - pkg-config
  - procps
  - python3
  - python3-pip
  - python3-venv
  - qemu-guest-agent
  - ripgrep
  - rsync
  - shellcheck
  - software-properties-common
  - strace
  - sudo
  - tmux
  - tree
  - uidmap
  - unzip
  - vim
  - wget
  - zip
  - zsh

write_files:
  - path: /etc/profile.d/jls-dev-path.sh
    owner: root:root
    permissions: '0644'
    content: |
      # User-local CLIs and mise shims installed by the JLS bootstrap.
      if [ -n "${HOME:-}" ]; then
        export PATH="$HOME/.local/bin:$HOME/.local/share/mise/shims:$PATH"
      fi

  - path: /etc/docker/daemon.json
    owner: root:root
    permissions: '0644'
    content: |
      {
        "log-driver": "local",
        "log-opts": {
          "max-size": "10m",
          "max-file": "3"
        }
      }

  - path: /etc/sysctl.d/99-jls-dev.conf
    owner: root:root
    permissions: '0644'
    content: |
      # Avoid file-watcher exhaustion in large Node and IDE workspaces.
      fs.inotify.max_user_instances = 1024
      fs.inotify.max_user_watches = 524288

  - path: /usr/local/bin/jls-doctor
    owner: root:root
    permissions: '0755'
    content: |
      #!/usr/bin/python3
      """Read-only checks in the caller's environment. No installs or authentication."""
      import argparse
      import datetime
      import json
      import os
      from pathlib import Path
      import pwd
      import shutil
      import subprocess


      def probe(argv):
          try:
              result = subprocess.run(argv, capture_output=True, text=True, timeout=5)
              # Bound output and never return credential-bearing environment/config data.
              return {"ok": result.returncode == 0, "exit_code": result.returncode,
                      "output": result.stdout.strip()[:512]}
          except subprocess.TimeoutExpired:
              return {"ok": False, "exit_code": None, "output": "timeout after 5s"}
          except OSError:
              return {"ok": False, "exit_code": None, "output": "command unavailable"}


      def collect():
          commands = {}
          for name in ("curl", "git", "gh", "jq", "rg", "fd", "mise", "node", "npm",
                       "uv", "python3", "make", "gcc", "tmux", "docker", "sbx", "claude", "codex", "paseo"):
              path = shutil.which(name)
              version = probe([path, "-V" if name == "tmux" else "--version"]) if path else None
              commands[name] = {"path": path, "available": bool(path), "version_probe": version}
          services = {name: probe(["systemctl", "is-active", name])
                      for name in ("docker", "qemu-guest-agent")}
          docker = {"compose": probe(["docker", "compose", "version"]),
                    "buildx": probe(["docker", "buildx", "version"]),
                    "daemon_access": probe(["docker", "info", "--format", "{{.ServerVersion}}"])}
          complete = Path('/var/lib/jls-dev/bootstrap-complete').is_file()
          failures = [f"command:{name}" for name, item in commands.items()
                      if not item['available'] or not item['version_probe']['ok']]
          failures += [f"service:{name}" for name, item in services.items() if not item['ok']]
          failures += [f"docker:{name}" for name, item in docker.items() if not item['ok']]
          if not complete:
              failures.append('bootstrap:incomplete')
          return {"schema_version": 1,
                  "checked_at": datetime.datetime.now(datetime.timezone.utc).isoformat(),
                  "user": pwd.getpwuid(os.getuid()).pw_name, "uid": os.getuid(),
                  "bootstrap_complete": complete, "authentication_checked": False,
                  "provisioned_versions_file": "/var/lib/jls-dev/versions.txt",
                  "commands": commands, "services": services, "docker": docker,
                  "kvm": {"exists": Path('/dev/kvm').exists(),
                          "accessible": os.access('/dev/kvm', os.R_OK | os.W_OK)},
                  "reboot_required": Path('/var/run/reboot-required').exists(),
                  "failures": failures, "ready": not failures}


      def main():
          parser = argparse.ArgumentParser(description=__doc__)
          parser.add_argument('--json', action='store_true', help='Print one JSON object; exit 1 when not ready')
          args = parser.parse_args()
          report = collect()
          if args.json:
              print(json.dumps(report, indent=2))
          else:
              print(f"Checking as {report['user']} (uid {report['uid']})")
              for name, item in report['commands'].items():
                  version = item['version_probe']
                  status = (version['output'].splitlines() or ['version unavailable'])[0] if version else 'MISSING'
                  print(f"{name:16} {item['path'] or '-'} | {status}")
              for name, item in report['services'].items():
                  print(f"service {name}: {'active' if item['ok'] else 'NOT ACTIVE'}")
              for name, item in report['docker'].items():
                  print(f"docker {name}: {'OK' if item['ok'] else 'UNAVAILABLE'}")
              print(f"bootstrap complete: {report['bootstrap_complete']}")
              print(f"local sandbox KVM access: {report['kvm']['accessible']} (optional)")
              print(f"reboot required: {report['reboot_required']}")
              print('Provisioning-time versions: ' + report['provisioned_versions_file'])
              if report['uid'] == 0:
                  print('Run as the agent login user to check that user\'s Docker/KVM permissions.')
              if report['failures']:
                  print('Not ready: ' + ', '.join(report['failures']))
              print('CLI availability does not verify authentication; no login checks were performed.')
          return 0 if report['ready'] else 1


      if __name__ == '__main__':
          raise SystemExit(main())

  - path: /usr/local/bin/jls-run
    owner: root:root
    permissions: '0755'
    content: |
      #!/usr/bin/env bash
      # Launch as the normal dev user; usable in a service ExecStart or over SSH.
      set -euo pipefail
      if [[ $# == 0 ]]; then
          echo 'Usage: jls-run COMMAND [ARG ...] (for example: jls-run codex)' >&2
          exit 2
      fi
      : "${HOME:?HOME must identify the agent user home}"
      export PATH="$HOME/.local/bin:$HOME/.local/share/mise/shims:/usr/local/bin:/usr/bin:/bin:${PATH:-}"
      exec "$@"

  - path: /usr/local/share/jls-dev/agent-context.md
    owner: root:root
    permissions: '0644'
    content: |
      # JLS development environment

      This is a persistent Ubuntu developer VM. Project instructions, runtime pins,
      and lockfiles determine project workflows; these are machine capabilities.

      - Provisioned: mise, Node.js/npm, uv, Python, GCC/make, Git/gh, curl, jq,
        rg, fd, tmux, Docker Engine, Buildx, Compose v2, and Docker Sandboxes (sbx).
      - mise manages the default Node.js and uv installations. Honor repository pins;
        do not change global runtimes to satisfy a single project.
      - Use `docker compose` (v2). `fd` is a symlink to Ubuntu's `fdfind`.
      - Keep dependencies and service data scoped to each repository. Use separate
        Python environments and Compose project names/volumes for different projects.
      - Run `jls-doctor --json` as your current user when verifying readiness or
        troubleshooting. Exit 1 still returns a valid report describing failures.
      - `/var/lib/jls-dev/versions.txt` records provisioning-time versions, not current
        versions. Check live versions when they matter.
      - Before reinstalling a missing tool, check PATH and mise. User tools live in
        `$HOME/.local/bin` and `$HOME/.local/share/mise/shims`.
      - For headless launches use `jls-run codex`, `jls-run claude`, or `jls-run paseo`.
        This sets PATH explicitly without relying on interactive shell startup files.
      - Installed CLIs do not imply authenticated accounts. Logins remain interactive.
      - Local Docker Sandboxes require accessible /dev/kvm and host nested virtualization.
        Missing KVM does not prevent ordinary development or cloud sandbox use.
      - These capabilities describe the devbox host. Inside a container or sandbox,
        inspect that environment rather than assuming host tools or access exist.
      - If provisioning is incomplete, inspect `cloud-init status --long` and
        `/var/log/jls-dev-bootstrap.log` before attempting repairs.

  - path: /usr/local/lib/jls-dev/install-agent-context
    owner: root:root
    permissions: '0755'
    content: |
      #!/usr/bin/python3
      """Maintain only the JLS block; run as the dev user, never as root."""
      import os
      from pathlib import Path
      import sys
      import tempfile

      START = '<!-- BEGIN JLS DEVBOX CONTEXT -->'
      END = '<!-- END JLS DEVBOX CONTEXT -->'


      def merge(original, context):
          block = START + '\n' + context.rstrip() + '\n' + END
          if START not in original and END not in original:
              return original + ('\n\n' if original and not original.endswith('\n\n') else '') + block + '\n'
          if original.count(START) != 1 or original.count(END) != 1:
              raise ValueError('Malformed or duplicate JLS markers; repair the instruction file first')
          first, last = original.index(START), original.index(END)
          if last < first:
              raise ValueError('Reversed JLS markers')
          return original[:first] + block + original[last + len(END):]


      def install(home, source):
          context = source.read_text()
          codex_home = Path(os.environ.get('CODEX_HOME') or home / '.codex')
          targets = [codex_home / 'AGENTS.md', home / '.claude/CLAUDE.md']
          # An existing override takes precedence in Codex; keep it aware too.
          override = codex_home / 'AGENTS.override.md'
          if override.exists():
              targets.append(override)
          updates = []
          for target in targets:
              # Follow user-managed symlinks while preserving the symlink itself.
              target = target.resolve()
              original = target.read_text() if target.exists() else ''
              updates.append((target, merge(original, context)))
          for target, content in updates:
              target.parent.mkdir(parents=True, exist_ok=True)
              mode = target.stat().st_mode & 0o777 if target.exists() else 0o644
              temporary = None
              try:
                  with tempfile.NamedTemporaryFile(mode='w', dir=target.parent, delete=False) as stream:
                      temporary = Path(stream.name)
                      stream.write(content)
                  temporary.chmod(mode)
                  os.replace(temporary, target)
              finally:
                  if temporary is not None and temporary.exists():
                      temporary.unlink()


      if __name__ == '__main__':
          install(Path.home(), Path(sys.argv[1] if len(sys.argv) > 1 else
                                   '/usr/local/share/jls-dev/agent-context.md'))

  - path: /etc/update-motd.d/99-jls-dev
    owner: root:root
    permissions: '0755'
    content: |
      #!/bin/sh
      if [ -f /var/lib/jls-dev/bootstrap-complete ]; then
        cat <<'EOF'

      JLS developer VM is ready.
        Check:       jls-doctor
        Claude:      jls-run claude
        Codex:       jls-run codex login --device-auth
        Sandboxes:   sbx login
        GitHub:      gh auth login
        Paseo:       jls-run paseo
      No model or repository credentials were baked into this VM.
      EOF
      else
        echo 'JLS developer bootstrap is still running; check cloud-init status --wait.'
      fi

  - path: /usr/local/sbin/jls-bootstrap-dev-vm
    owner: root:root
    permissions: '0755'
    content: |
      #!/usr/bin/env bash
      set -Eeuo pipefail
      umask 022

      install -d -m 0755 /var/lib/jls-dev
      # A failed rerun must not leave an old success marker.
      rm -f /var/lib/jls-dev/bootstrap-complete
      exec > >(tee -a /var/log/jls-dev-bootstrap.log) 2>&1
      trap 'echo "JLS bootstrap failed at line ${LINENO}; rerun sudo /usr/local/sbin/jls-bootstrap-dev-vm after correcting the error."' ERR

      echo "[$(date --iso-8601=seconds)] Starting JLS developer VM bootstrap"

      # Proxmox creates the login account through its generated user-data.
      # Select the first normal /home user, with an optional explicit override.
      dev_user="${JLS_DEV_USER:-}"
      if [ -z "$dev_user" ]; then
        dev_user="$(getent passwd | awk -F: '$3 >= 1000 && $3 < 60000 && $6 ~ /^\/home\// && $7 !~ /(nologin|false)$/ { print $1; exit }')"
      fi
      if [ -z "$dev_user" ] || ! id "$dev_user" >/dev/null 2>&1; then
        echo 'Could not identify the Proxmox cloud-init login user.' >&2
        exit 1
      fi
      dev_home="$(getent passwd "$dev_user" | cut -d: -f6)"
      dev_group="$(id -gn "$dev_user")"
      echo "Provisioning user: $dev_user ($dev_home)"

      export DEBIAN_FRONTEND=noninteractive

      # Docker Engine + Buildx + Compose v2 + Sandboxes from Docker's apt repository.
      install -d -m 0755 /etc/apt/keyrings
      curl --fail --silent --show-error --location \
        https://download.docker.com/linux/ubuntu/gpg \
        --output /etc/apt/keyrings/docker.asc
      chmod a+r /etc/apt/keyrings/docker.asc

      docker_arch="$(dpkg --print-architecture)"
      . /etc/os-release
      if [ "${ID:-}" != ubuntu ]; then
        echo "This bootstrap supports Ubuntu only; detected ${PRETTY_NAME:-unknown}." >&2
        exit 1
      fi
      docker_suite="${UBUNTU_CODENAME:-$VERSION_CODENAME}"
      cat >/etc/apt/sources.list.d/docker.sources <<EOF
      Types: deb
      URIs: https://download.docker.com/linux/ubuntu
      Suites: ${docker_suite}
      Components: stable
      Architectures: ${docker_arch}
      Signed-By: /etc/apt/keyrings/docker.asc
      EOF

      apt-get update
      apt-get install --yes --no-install-recommends \
        containerd.io \
        docker-buildx-plugin \
        docker-ce \
        docker-ce-cli \
        docker-compose-plugin \
        docker-sbx

      systemctl enable --now docker
      systemctl enable --now qemu-guest-agent
      sysctl --system >/dev/null

      # Ubuntu packages fd as fdfind to avoid a historical name collision.
      ln -sfn "$(command -v fdfind)" /usr/local/bin/fd

      # Membership in the docker group is intentionally enabled for this trusted
      # personal VM. It is effectively root access and is not an isolation boundary.
      usermod --append --groups docker "$dev_user"

      # Local Docker Sandboxes use KVM; nested virtualization must be exposed
      # by the Proxmox host. Allow cloud-only use when /dev/kvm is unavailable.
      groupadd --force kvm
      usermod --append --groups kvm "$dev_user"

      # Install user-owned tools. Nothing below needs or receives credentials.
      runuser --user "$dev_user" -- env HOME="$dev_home" bash -lc '
        set -Eeuo pipefail
        curl -fsSL https://mise.run | sh
        export PATH="$HOME/.local/bin:$HOME/.local/share/mise/shims:$PATH"

        mise use --global node@lts uv@latest
        mise exec -- npm install --global @getpaseo/cli
        mise reshim

        # Stable Claude Code channel; the native install updates itself.
        curl -fsSL https://claude.ai/install.sh | bash -s stable

        # Official Codex standalone installer.
        curl -fsSL https://chatgpt.com/codex/install.sh | sh
      '

      # Ensure interactive shells activate mise without duplicating the block.
      bash_marker='# >>> JLS mise activation >>>'
      bashrc="$dev_home/.bashrc"
      if ! grep -Fq "$bash_marker" "$bashrc" 2>/dev/null; then
        cat >>"$bashrc" <<'EOF'

      # >>> JLS mise activation >>>
      export PATH="$HOME/.local/bin:$HOME/.local/share/mise/shims:$PATH"
      eval "$(mise activate bash)"
      # <<< JLS mise activation <<<
      EOF
      fi

      zshrc="$dev_home/.zshrc"
      if ! grep -Fq "$bash_marker" "$zshrc" 2>/dev/null; then
        cat >>"$zshrc" <<'EOF'
      # >>> JLS mise activation >>>
      export PATH="$HOME/.local/bin:$HOME/.local/share/mise/shims:$PATH"
      eval "$(mise activate zsh)"
      # <<< JLS mise activation <<<
      EOF
      fi
      chown "$dev_user:$dev_group" "$bashrc" "$zshrc"

      # Install machine guidance as the discovered user, preserving personal text.
      runuser --user "$dev_user" -- env HOME="$dev_home" CODEX_HOME="$dev_home/.codex" \
        /usr/local/lib/jls-dev/install-agent-context

      # Record what this particular VM resolved at provision time.
      runuser --user "$dev_user" -- env HOME="$dev_home" bash -lc '
        set -u
        export PATH="$HOME/.local/bin:$HOME/.local/share/mise/shims:$PATH"
        {
          echo "provisioned_at=$(date --iso-8601=seconds)"
          echo "os=$(source /etc/os-release; printf %s "$PRETTY_NAME")"
          echo "kernel=$(uname -r)"
          echo "mise=$(mise --version 2>/dev/null || true)"
          echo "node=$(node --version 2>/dev/null || true)"
          echo "npm=$(npm --version 2>/dev/null || true)"
          echo "uv=$(uv --version 2>/dev/null || true)"
          echo "docker=$(docker --version 2>/dev/null || true)"
          echo "compose=$(docker compose version 2>/dev/null || true)"
          echo "sbx=$(sbx --version)"
          echo "claude=$(claude --version 2>/dev/null || true)"
          echo "codex=$(codex --version 2>/dev/null || true)"
          echo "paseo=$(paseo --version 2>/dev/null || true)"
        }
      ' >/var/lib/jls-dev/versions.txt

      touch /var/lib/jls-dev/bootstrap-complete
      echo "[$(date --iso-8601=seconds)] JLS developer VM bootstrap complete"

runcmd:
  - [bash, -lc, /usr/local/sbin/jls-bootstrap-dev-vm]

final_message: |
  JLS developer VM cloud-init finished after $UPTIME seconds.
  Log in again, run jls-doctor, then authenticate with claude, codex, gh, and paseo.
